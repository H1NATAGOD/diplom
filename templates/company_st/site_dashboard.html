{% extends 'base.html' %}
{% block content %}
<h2>Панель Финансиста: Работа со сметами</h2>
<form method="post" class="mb-4">
    {% csrf_token %}
    <select name="project" class="form-select mb-2">
        {% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
    </select>
    <input type="number" name="cost" placeholder="Итоговая сумма" class="form-control mb-2">
    <button class="btn btn-success">Рассчитать стоимость</button>
</form>
<table class="table">
    <thead><tr><th>Проект</th><th>Сумма</th></tr></thead>
    {% for est in estimates %}
    <tr><td>{{ est.project.name }}</td><td>{{ est.total_price }} руб.</td></tr>
    {% endfor %}
</table>
{% endblock %}
